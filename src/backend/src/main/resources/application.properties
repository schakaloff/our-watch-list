spring.application.name=backend

spring.config.import=optional:file:./.env[.properties]

supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

tmdb.url=https://api.themoviedb.org/3
tmdb.token=${TMDB_TOKEN}

# Settings that differ between your computer and the real server.
# Each one has a default for local use; the host overrides it with an environment variable.
server.port=${PORT:8080}
# Behind a host like Railway, trust the proxy's "this request was HTTPS" header, so cookies get the Secure flag.
server.forward-headers-strategy=framework
supabase.cookie-secure=${COOKIE_SECURE:false}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
