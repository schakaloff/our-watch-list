<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Our Watch List</title>
  <!-- Clapperboard: a green board with a striped clapper lifted on top -->
  <rect x="6" y="28" width="52" height="30" rx="4" fill="#059669"/>
  <rect x="12" y="36" width="40" height="3" rx="1.5" fill="#ecfdf5" opacity=".55"/>
  <rect x="12" y="43" width="28" height="3" rx="1.5" fill="#ecfdf5" opacity=".55"/>
  <g transform="rotate(-14 8 26)">
    <clipPath id="clapper"><rect x="6" y="12" width="52" height="14" rx="3"/></clipPath>
    <rect x="6" y="12" width="52" height="14" rx="3" fill="#0f172a"/>
    <g clip-path="url(#clapper)" fill="#f8fafc">
      <path d="M14 12h9l-8 14H6z"/>
      <path d="M32 12h9l-8 14h-9z"/>
      <path d="M50 12h9l-8 14h-9z"/>
    </g>
  </g>
</svg>
